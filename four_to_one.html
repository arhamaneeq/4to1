<div className="box" style=${{display:'grid',gap:8}}><div style=${{display:'flex',justifyContent:'space-between'}}><span style=${{color:'var(--mut)'}}>Campus</span><b style=${{display:'flex',gap:6,alignItems:'center'}}><${Ic} n="lock" s=${14}/>IIT Indore</b></div><div style=${{display:'flex',justifyContent:'space-between'}}><span style=${{color:'var(--mut)'}}>Academic year</span><b>3rd year, B.Tech</b></div><small style=${{color:'var(--mut)'}}>Campus is tied to your verified student ID and can’t be changed.</small></div>
<div className="box" style=${{padding:'0 14px'}}>${M('tag','My listings',()=>X.go('mine'))}${M('box','My purchases',()=>{X.setAt('buy');X.tabTo('activity')})}${M('list','My sales',()=>{X.setAt('sell');X.tabTo('activity')})}${M('info','Marketplace information',()=>setSh('info'))}${M('sl','Settings',()=>setSh('set'))}${M('out','Log out',()=>setSh('out'))}</div>
${sh&&html`<${Sheet} close=${()=>setSh(0)}>${sh==='info'?html`<h2 className="h1" style=${{fontSize:18,marginBottom:10}}>How 4 to 1 works</h2><p style=${{color:'var(--mut)'}}>${DISC}</p><div className="note"><${Ic} n="lock" s=${18}/><span>Buyers and sellers never see each other’s identity or contact details. 4 to 1 coordinates requests, payment and handover.</span></div>`:sh==='set'?html`<h2 className="h1" style=${{fontSize:18,marginBottom:10}}>Settings</h2>${['Push notifications','Email updates'].map(s=>html`<label key=${s} style=${{display:'flex',justifyContent:'space-between',padding:'12px 0'}}>${s}<input type="checkbox" defaultChecked/></label>`)}<button className="btn s" style=${{marginTop:10}} onClick=${()=>{try{localStorage.removeItem(K)}catch(e){}location.reload()}}>Reset demo data</button>`:html`<h2 className="h1" style=${{fontSize:18,marginBottom:10}}>Log out?</h2><p style=${{color:'var(--mut)',marginBottom:16}}>This is a simulated logout.</p><button className="btn" onClick=${()=>{setSh(0);X.setOut(1)}}>Log out</button>`}<//>`}</div>`}

function App(){const [S,setS]=useState(load),[tab,setTab]=useState('home'),[stack,setSt]=useState([]),[q,setQ]=useState(''),[fo,setFo]=useState(0),[at,setAt]=useState('buy'),[out,setOut]=useState(0),[toast,setT]=useState(''),[F,setF]=useState({cat:'All',cond:[],min:'',max:'',sort:'new'});
React.useEffect(()=>save(S),[S]);
const upd=f=>setS(f),top=stack[stack.length-1];
const X={S,upd,q,setQ,fo,setFo,at,setAt,F,setF,setOut,go:(v,a)=>setSt(s=>[...s,{v,a}]),back:()=>setSt(s=>s.slice(0,-1)),open:id=>setSt(s=>[...s,{v:'p',a:id}]),tabTo:t=>{setTab(t);setSt([]);if(t!=='explore')setFo(0)},flash:m=>{setT(m);setTimeout(()=>setT(''),2200)},
A:{req:pid=>upd(s=>{const p=s.items.find(i=>i.id===pid);return{...s,tx:[{id:'T'+Date.now(),pid,role:'buy',st:'Request Submitted',w:'Just now'},...s.tx],nf:[N(`Request for “${p.t}” submitted. 4 to 1 will coordinate with the seller.`,['act','buy'],'box'),...s.nf]}}),
st:(tid,st)=>upd(s=>{const t=s.tx.find(x=>x.id===tid),p=s.items.find(i=>i.id===t.pid);return{...s,tx:s.tx.map(x=>x.id===tid?{...x,st,w:'Just now'}:x),items:st==='Completed'&&t.role==='sell'?s.items.map(i=>i.id===p.id?{...i,st:'Sold'}:i):s.items,nf:[N(`“${p.t}”: ${st}.`,['act',t.role],st==='Completed'?'check':'box'),...s.nf]}}),
item:(it,nw)=>upd(s=>({...s,items:s.items.some(i=>i.id===it.id)?s.items.map(i=>i.id===it.id?it:i):[it,...s.items],nf:nw?[N(`Your listing “${it.t}” is live.`,['mine'],'tag'),...s.nf]:s.nf}))}};
if(out)return html`<div id="app" style=${{placeItems:'center',display:'grid',textAlign:'center',padding:30}}><div><div className="logo" style=${{fontSize:40}}>4 to 1</div><p style=${{color:'var(--mut)',margin:'8px 0 24px'}}>You’re logged out.</p><button className="btn" onClick=${()=>setOut(0)}>Sign in as Aarav (simulated)</button></div></div>`;
const T=[['home','Home','home'],['explore','Explore','compass'],['sell','Sell','plus'],['activity','Activity','list'],['profile','Profile','user']];
let V;if(top){const{v,a}=top;V=v==='p'?html`<${Detail} key=${a} id=${a}/>`:v==='notifs'?html`<${Notifs}/>`:v==='mine'?html`<${Mine}/>`:html`<${Sell} edit=${S.items.find(i=>i.id===a)} done=${X.back}/>`}else V=tab==='home'?html`<${Home}/>`:tab==='explore'?html`<${Explore}/>`:tab==='sell'?html`<${Sell} key=${Date.now()>0&&tab}/>`:tab==='activity'?html`<${Activity}/>`:html`<${Profile}/>`;
return html`<${Cx.Provider} value=${X}>${V}<nav className="nav">${T.map(([k,l,i])=>html`<button key=${k} className=${(tab===k?'on ':'')+(k==='sell'?'sell':'')} onClick=${()=>X.tabTo(k)} aria-label=${l}>${k==='sell'?html`<span><${Ic} n="plus" s=${26}/></span>`:html`<${Ic} n=${i}/>`}${l}</button>`)}</nav>${toast&&html`<div className="toast">${toast}</div>`}<//>`}
ReactDOM.createRoot(document.getElementById('app')).render(html`<${App}/>`);
</script></body></html>
